apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: payment-gateway-root
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
  - resources-finalizer.argocd.argoproj.io
spec:
  project: payment-gateway
  source:
    repoURL: https://github.com/MamangRust/monolith-payment-gateway-grpc.git
    targetRevision: main
    path: deployments/gitops/argocd/production
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
      allowEmpty: false
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
