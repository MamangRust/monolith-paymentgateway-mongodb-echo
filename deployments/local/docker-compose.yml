services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: DRAGON
      MONGO_INITDB_ROOT_PASSWORD: DRAGON
      MONGO_INITDB_DATABASE: PAYMENT_GATEWAY
    command:
      - "mongod"
      - "--bind_ip_all"
      - "--wiredTigerCacheSizeGB"
      - "1"
      - "--slowms"
      - "1000"
      - "--setParameter"
      - "maxConns=1000"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u DRAGON -p DRAGON --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40
    profiles: ["observability"]
    container_name: mongodb_exporter
    restart: unless-stopped

    command:
      - "--mongodb.uri=mongodb://DRAGON:DRAGON@mongo:27017/PAYMENT_GATEWAY?sslmode=disable&authSource=admin&connect_timeout=10s"
      - "--collector.dbstats"
      - "--collector.diagnosticdata"
      - "--collector.replicasetstatus"
      - "--web.listen-address=0.0.0.0:9216"

    ports:
      - "9216:9216"

    depends_on:
      - mongo

    networks:
      - app_network

    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 256M

  pyroscope:
    image: grafana/pyroscope:latest
    profiles: ["observability"]
    ports:
    - 4040:4040
    networks:
      - app_network

  redis-auth:
    image: redis:7.4
    container_name: redis_auth_debug
    command: >
      redis-server
      --requirepass dragon_knight
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --maxclients 200
    ports:
      - "6380:6379"
    volumes:
      - redis_auth_data:/data 
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dragon_knight", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

