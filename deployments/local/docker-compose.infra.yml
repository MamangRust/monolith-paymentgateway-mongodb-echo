# Infrastructure-only Compose for the E2E flow.
#
# Used by `scripts/e2e.sh` so the Go stack can be run natively on the host
# (faster feedback loop, no per-service image rebuild) while infra lives in
# containers. Ports are host-mapped to the same values that
# `deployments/local/local.env` expects on the host side.
#
# No `migrate`/`apigateway`/gRPC service containers are defined here on
# purpose — the e2e script runs those as host processes.
#
# Usage:
#   docker compose -f deployments/local/docker-compose.infra.yml up -d
#   docker compose -f deployments/local/docker-compose.infra.yml down -v
services:
  mongo:
    image: mongo:7.0
    container_name: mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: DRAGON
      MONGO_INITDB_ROOT_PASSWORD: DRAGON
      MONGO_INITDB_DATABASE: PAYMENT_GATEWAY
    command:
      - "mongod"
      - "--bind_ip_all"
      - "--wiredTigerCacheSizeGB"
      - "1"
      - "--slowms"
      - "1000"
      - "--setParameter"
      - "maxConns=1000"
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet -u DRAGON -p DRAGON --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis-apigateway:
    image: redis:7.4
    container_name: redis_apigateway
    command: >
      redis-server
      --requirepass dragon_knight
      --maxmemory 96mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --tcp-backlog 511
      --timeout 0
      --tcp-keepalive 300
      --maxclients 200
    ports:
      - "6379:6379"
    volumes:
      - redis_apigateway_data:/data
    restart: unless-stopped
    networks:
      - app_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "dragon_knight", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

