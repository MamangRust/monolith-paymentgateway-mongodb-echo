apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: payment-gateway
data:
  dashboards.yaml: |
    apiVersion: 1
    
    providers:
      - name: 'default'
        orgId: 1
        folder: ''
        type: file
        disableDeletion: false
        updateIntervalSeconds: 10
        allowUiUpdates: true
        options:
          path: /etc/grafana/provisioning/dashboards

  business-metrics.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
          "tags": [],
          "targetBlank": true,
          "title": "Overview",
          "type": "link",
          "url": "/d/payment-gateway-overview"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 200,
          "title": "Financial Domains",
          "type": "row"
        },
        {
          "id": 201,
          "type": "stat",
          "title": "Topup Requests",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=\"topup-service\"}[$__rate_interval]))",
              "legendFormat": "topup",
              "refId": "A"
            }
          ]
        },
        {
          "id": 202,
          "type": "stat",
          "title": "Transfer Requests",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 4, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=\"transfer-service\"}[$__rate_interval]))",
              "legendFormat": "transfer",
              "refId": "A"
            }
          ]
        },
        {
          "id": 203,
          "type": "stat",
          "title": "Withdraw Requests",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 8, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=\"withdraw-service\"}[$__rate_interval]))",
              "legendFormat": "withdraw",
              "refId": "A"
            }
          ]
        },
        {
          "id": 204,
          "type": "stat",
          "title": "Transaction Requests",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 12, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=\"transaction-service\"}[$__rate_interval]))",
              "legendFormat": "transaction",
              "refId": "A"
            }
          ]
        },
        {
          "id": 205,
          "type": "stat",
          "title": "Merchant Requests",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 16, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=~\"merchant-service|card-service\"}[$__rate_interval]))",
              "legendFormat": "merchant+card",
              "refId": "A"
            }
          ]
        },
        {
          "id": 206,
          "type": "stat",
          "title": "Saldo Requests",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 4, "x": 20, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "reqps",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=\"saldo-service\"}[$__rate_interval]))",
              "legendFormat": "saldo",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 5 },
          "id": 210,
          "title": "Domain Volume & Health",
          "type": "row"
        },
        {
          "id": 211,
          "type": "timeseries",
          "title": "Financial Domain Volume (RPS)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 20,
                "lineInterpolation": "smooth",
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "normal" }
              },
              "unit": "reqps"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["max", "mean"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=~\"$service\"}[$__rate_interval])) by (service_name)",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 212,
          "type": "timeseries",
          "title": "Success vs Error Volume",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 6 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 25,
                "lineWidth": 1,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "reqps"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "errors" },
                "properties": [
                  { "id": "color", "value": { "fixedColor": "red", "mode": "fixed" } },
                  { "id": "custom.fillOpacity", "value": 60 }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "success" },
                "properties": [{ "id": "color", "value": { "fixedColor": "green", "mode": "fixed" } }]
              }
            ]
          },
          "options": {
            "legend": { "calcs": ["max", "mean"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=~\"$service\"}[$__rate_interval])) - sum(rate(golang_app_requests_total{service_name=~\"$service\",status=\"error\"}[$__rate_interval]))",
              "legendFormat": "success",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=~\"$service\",status=\"error\"}[$__rate_interval]))",
              "legendFormat": "errors",
              "refId": "B"
            }
          ]
        },
        {
          "id": 213,
          "type": "timeseries",
          "title": "Domain Error Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 14 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 15,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=~\"$service\",status=\"error\"}[$__rate_interval])) by (service_name) / clamp_min(sum(rate(golang_app_requests_total{service_name=~\"$service\"}[$__rate_interval])) by (service_name), 1)",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 214,
          "type": "timeseries",
          "title": "Domain P95 Latency",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 14 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "custom": {
                "drawStyle": "line",
                "fillOpacity": 10,
                "lineWidth": 2,
                "showPoints": "never",
                "spanNulls": true,
                "stacking": { "group": "A", "mode": "none" }
              },
              "unit": "s"
            },
            "overrides": []
          },
          "options": {
            "legend": { "calcs": ["max"], "displayMode": "table", "placement": "bottom", "showLegend": true },
            "tooltip": { "mode": "multi", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(golang_app_request_duration_seconds_bucket{service_name=~\"$service\"}[$__rate_interval])) by (le, service_name))",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 22 },
          "id": 220,
          "title": "Operation Breakdown",
          "type": "row"
        },
        {
          "id": 221,
          "type": "table",
          "title": "Top Operations (last 1h)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 23 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": {
                "align": "auto",
                "cellOptions": { "type": "auto" },
                "inspect": false
              },
              "unit": "short"
            },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Error Rate" },
                "properties": [
                  {
                    "id": "unit",
                    "value": "percentunit"
                  },
                  {
                    "id": "custom.cellOptions",
                    "value": { "type": "gauge", "mode": "gradient" }
                  },
                  {
                    "id": "color",
                    "value": {
                      "mode": "thresholds",
                      "thresholds": {
                        "mode": "absolute",
                        "steps": [
                          { "color": "green", "value": null },
                          { "color": "yellow", "value": 0.01 },
                          { "color": "red", "value": 0.05 }
                        ]
                      }
                    }
                  }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "RPS" },
                "properties": [{ "id": "unit", "value": "reqps" }]
              }
            ]
          },
          "options": {
            "cellHeight": "sm",
            "footer": { "countRows": false, "fields": "", "reducer": ["sum"], "show": false },
            "showHeader": true,
            "sortBy": [{ "desc": true, "displayName": "Requests (1h)" }]
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=~\"$service\"}[1h])) by (service_name, method)",
              "format": "table",
              "instant": true,
              "legendFormat": "__auto",
              "refId": "A"
            },
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=~\"$service\",status=\"error\"}[1h])) by (service_name, method) / clamp_min(sum(rate(golang_app_requests_total{service_name=~\"$service\"}[1h])) by (service_name, method), 1)",
              "format": "table",
              "instant": true,
              "legendFormat": "__auto",
              "refId": "B"
            }
          ],
          "transformations": [
            {
              "id": "joinByField",
              "options": {
                "byField": "method",
                "mode": "outer"
              }
            },
            {
              "id": "organize",
              "options": {
                "excludeByName": {},
                "indexByName": {
                  "Time 1": 6,
                  "Time 2": 7,
                  "Value #A": 3,
                  "Value #B": 5,
                  "method": 0,
                  "service_name": 1,
                  "service_name 1": 2
                },
                "renameByName": {
                  "Value #A": "Requests (1h)",
                  "Value #B": "Error Rate",
                  "method": "Method",
                  "service_name": "Service",
                  "service_name 1": "Service"
                }
              }
            }
          ]
        },
        {
          "id": 222,
          "type": "piechart",
          "title": "Traffic Share by Service",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 12, "y": 23 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "short"
            },
            "overrides": []
          },
          "options": {
            "displayLabels": ["name", "percent"],
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": true, "values": ["percent"] },
            "pieType": "donut",
            "reduceOptions": { "calcs": ["sum"], "fields": "", "values": false },
            "tooltip": { "mode": "single", "sort": "desc" }
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(rate(golang_app_requests_total{service_name=~\"$service\"}[$__rate_interval])) by (service_name)",
              "legendFormat": "{{service_name}}",
              "refId": "A"
            }
          ]
        },
        {
          "id": 223,
          "type": "gauge",
          "title": "Overall Success Rate",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 8, "w": 6, "x": 18, "y": 23 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 0.95 },
                  { "color": "green", "value": 0.99 }
                ]
              },
              "unit": "percentunit"
            },
            "overrides": []
          },
          "options": {
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "showThresholdLabels": true,
            "showThresholdMarkers": true
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "1 - sum(rate(golang_app_requests_total{service_name=~\"$service\",status=\"error\"}[$__rate_interval])) / clamp_min(sum(rate(golang_app_requests_total{service_name=~\"$service\"}[$__rate_interval])), 1)",
              "legendFormat": "success rate",
              "refId": "A"
            }
          ]
        },
        {
          "id": 224,
          "type": "logs",
          "title": "Financial Service Logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 31 },
          "fieldConfig": {
            "defaults": { "custom": {} },
            "overrides": []
          },
          "options": {
            "dedupStrategy": "none",
            "enableLogDetails": true,
            "prettifyLogMessage": false,
            "showCommonLabels": false,
            "showLabels": false,
            "showTime": true,
            "sortOrder": "Descending",
            "wrapLogMessage": true
          },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "editorMode": "code",
              "expr": "{job=~\"apigateway|auth-service|user-service|role-service|card-service|merchant-service|saldo-service|topup-service|transaction-service|transfer-service|withdraw-service|email-service\"} | json | line_format \"{{.level}} | {{.msg}}\"",
              "queryType": "range",
              "refId": "A"
            }
          ]
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "tags": ["payment-gateway", "business", "kpi", "go"],
      "templating": {
        "list": [
          {
            "current": { "selected": true, "text": ["All"], "value": ["$__all"] },
            "datasource": { "type": "prometheus", "uid": "prometheus" },
            "definition": "label_values(golang_app_requests_total, service_name)",
            "hide": 0,
            "includeAll": true,
            "multi": true,
            "name": "service",
            "options": [],
            "query": { "query": "label_values(golang_app_requests_total, service_name)", "refId": "Prometheus-service-Variable-Query" },
            "refresh": 1,
            "regex": "",
            "sort": 1,
            "type": "query"
          }
        ]
      },
      "time": { "from": "now-6h", "to": "now" },
      "timepicker": {
        "refresh_intervals": ["5s", "10s", "30s", "1m", "5m"],
        "time_options": ["5m", "15m", "1h", "6h", "12h", "24h", "2d", "7d", "30d"]
      },
      "timezone": "browser",
      "title": "Payment Gateway Business Metrics",
      "uid": "payment-gateway-business",
      "version": 2,
      "weekStart": ""
    }

  go-services-runtime.json: |
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": { "type": "grafana", "uid": "-- Grafana --" },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "id": null,
      "links": [
        {
          "asDropdown": false,
          "icon": "external link",
          "includeVars": true,
          "keepTime": true,
          "tags": [],
          "targetBlank": true,
          "title": "Overview",
          "type": "link",
          "url": "/d/payment-gateway-overview"
        }
      ],
      "panels": [
        {
          "collapsed": false,
          "gridPos": { "h": 1, "w": 24, "x": 0, "y": 0 },
          "id": 400,
          "title": "Runtime Summary",
          "type": "row"
        },
        {
          "id": 401,
          "type": "stat",
          "title": "Total Heap (All Services)",
          "datasource": { "type": "prometheus", "uid": "prometheus" },
          "gridPos": { "h": 4, "w": 6, "x": 0, "y": 1 },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "palette-classic" },
              "unit": "bytes",
              "thresholds": { "mode": "absolute", "steps": [{ "color": "green", "value": null }] }
            },
            "overrides": []
          },
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "justifyMode": "auto",
            "orientation": "auto",
            "reduceOptions": { "calcs": ["lastNotNull"], "fields": "", "values": false },
            "textMode": "auto"
          },
          "targets": [
            {
              "datasource": { "type": "prometheus", "uid": "prometheus" },
              "expr": "sum(go_memstats_heap_alloc_bytes{application=~\"$application\"})",
