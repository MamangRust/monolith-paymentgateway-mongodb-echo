apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb-exporter
  namespace: payment-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mongodb-exporter
  template:
    metadata:
      labels:
        app: mongodb-exporter
    spec:
      containers:
      - name: mongodb-exporter
        image: percona/mongodb_exporter:0.40
        imagePullPolicy: IfNotPresent
        args:
        - "--mongodb.uri=mongodb://$(DB_USERNAME):$(DB_PASSWORD)@mongo.payment-gateway.svc.cluster.local:27017/PAYMENT_GATEWAY?authSource=admin&connect_timeout=10s"
        - "--collector.dbstats"
        - "--collector.diagnosticdata"
        - "--collector.replicasetstatus"
        - "--web.listen-address=0.0.0.0:9216"
        env:
        - name: DB_USERNAME
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_USERNAME
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: app-secrets
              key: DB_PASSWORD
        ports:
        - containerPort: 9216
        resources:
          requests:
            memory: "64Mi"
            cpu: "50m"
          limits:
            memory: "128Mi"
            cpu: "150m"
        readinessProbe:
          httpGet:
            path: /
            port: 9216
          initialDelaySeconds: 5
          periodSeconds: 10
          failureThreshold: 5
        livenessProbe:
          httpGet:
            path: /
            port: 9216
          initialDelaySeconds: 15
          periodSeconds: 20
          failureThreshold: 3
